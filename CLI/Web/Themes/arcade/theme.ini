[theme]
name=Arcade
note=Pixel type and neon, like an arcade screen.

[variant synthwave]
name=Synthwave
swatch=#22e6ff #ff3fd2 #ffe95c #62ffb0

[variant classic]
name=Classic
swatch=#f2f2f2 #ffd84d #6fd6ff #ff7aa8

[variant phosphor]
name=Phosphor
swatch=#4dff88 #d4ff5c #2fe0c4 #b6ffd0

[variant amber]
name=Amber
swatch=#ffb31a #fff0c2 #ff6a3d #ffd36b

[option scanlines]
name=Scanlines
note=Fine lines and dark edges, like an old monitor.
default=on

[option flicker]
name=Flicker
note=The screen flickers now and then.
default=off
