name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  window:
    name: Window program (Windows)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7

      - uses: microsoft/setup-msbuild@v3

      - name: Build the program and its tests
        run: msbuild Manifold-Idler.sln /p:Configuration=Release /p:Platform=x64 /m /nologo /v:minimal

      - name: Run the tests
        run: .\Build\Windows\Release\Manifold-Idler.Tests.exe

      - name: Gather the program
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item Build\Windows\Release\Manifold-Idler.exe, LICENSE, README.md dist\
          Copy-Item Licenses dist\Licenses -Recurse

      - uses: actions/upload-artifact@v7
        with:
          name: Manifold-Idler-windows-x64
          path: dist/
          if-no-files-found: error

      - name: Gather the Sprite Creator
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist-creator | Out-Null
          Copy-Item Build\Windows\Release\Manifold-Idler-Sprite-Creator.exe, Tools\CreatureForge\STYLE.md, LICENSE, README.md dist-creator\
          Copy-Item Tools\CreatureForge\creatures dist-creator\creatures -Recurse
          Copy-Item Licenses dist-creator\Licenses -Recurse

      - uses: actions/upload-artifact@v7
        with:
          name: Manifold-Idler-Sprite-Creator-windows-x64
          path: dist-creator/
          if-no-files-found: error

  window-linux:
    name: Window program (Linux)
    runs-on: ubuntu-24.04
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v7

      - name: Stand in for SDL3 while linking
        run: python3 Linux/Tools/cross-linux.py --stub-only Build/Linux/stub --cc clang

      - name: Configure
        run: cmake -S Linux -B Build/Linux -DCMAKE_BUILD_TYPE=Release -DIDLER_SDL_LIBRARY="$PWD/Build/Linux/stub/libSDL3.so"

      - name: Build
        run: cmake --build Build/Linux --parallel

      - name: Check what it needs at run time
        run: |
          strip Build/Linux/manifold-idler
          readelf -d Build/Linux/manifold-idler | grep NEEDED
          readelf -d Build/Linux/manifold-idler | grep -q 'libSDL3.so.0'

      - name: Gather the program
        run: |
          mkdir dist
          cp Build/Linux/manifold-idler LICENSE dist/
          cp Linux/README.md dist/README.md
          cp -r Licenses dist/Licenses

      - uses: actions/upload-artifact@v7
        with:
          name: Manifold-Idler-linux-x86_64
          path: dist/
          if-no-files-found: error

  cli:
    name: CLI (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            artifact: idler-windows-x64
            binary: Build/CLI/Release/idler.exe
          - os: ubuntu-24.04
            artifact: idler-linux-x86_64
            binary: Build/CLI/idler
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Configure
        run: cmake -S CLI -B Build/CLI -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build Build/CLI --config Release --parallel

      - name: Run the tests
        run: ctest --test-dir Build/CLI -C Release --output-on-failure

      - name: Gather the program
        shell: bash
        run: |
          mkdir dist
          cp "${{ matrix.binary }}" LICENSE CLI/README.md dist/
          cp Dependencies/CLI11/LICENSE dist/CLI11-LICENSE
          cp Licenses/Press-Start-2P.txt Licenses/VT323.txt Licenses/stb.txt dist/

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: dist/
          if-no-files-found: error

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [window, window-linux, cli]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Pack and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd artifacts
          find idler-linux-x86_64 -type f -name idler -exec chmod +x {} +
          find Manifold-Idler-linux-x86_64 -type f -name manifold-idler -exec chmod +x {} +
          for dir in */; do
            (cd "$dir" && zip -r -q "../${dir%/}.zip" .)
          done
          gh release create "$GITHUB_REF_NAME" ./*.zip --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
