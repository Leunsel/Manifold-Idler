name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  window:
    name: Window program (Windows)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7

      - uses: microsoft/setup-msbuild@v3

      - name: Build the program and its tests
        run: msbuild Manifold-Idler.sln /p:Configuration=Release /p:Platform=x64 /m /nologo /v:minimal

      - name: Run the tests
        run: .\Build\Windows\Release\Manifold-Idler.Tests.exe

      - name: Gather the program
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item Build\Windows\Release\Manifold-Idler.exe, LICENSE, README.md dist\
          Copy-Item Licenses dist\Licenses -Recurse

      - uses: actions/upload-artifact@v7
        with:
          name: Manifold-Idler-windows-x64
          path: dist/
          if-no-files-found: error

  cli:
    name: CLI (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            artifact: idler-windows-x64
            binary: Build/CLI/Release/idler.exe
          - os: ubuntu-24.04
            artifact: idler-linux-x86_64
            binary: Build/CLI/idler
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Configure
        run: cmake -S CLI -B Build/CLI -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build Build/CLI --config Release --parallel

      - name: Run the tests
        run: ctest --test-dir Build/CLI -C Release --output-on-failure

      - name: Gather the program
        shell: bash
        run: |
          mkdir dist
          cp "${{ matrix.binary }}" LICENSE CLI/README.md dist/
          cp Dependencies/CLI11/LICENSE dist/CLI11-LICENSE
          cp Licenses/Press-Start-2P.txt Licenses/VT323.txt dist/

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: dist/
          if-no-files-found: error

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [window, cli]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Pack and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd artifacts
          find idler-linux-x86_64 -type f -name idler -exec chmod +x {} +
          for dir in */; do
            (cd "$dir" && zip -r -q "../${dir%/}.zip" .)
          done
          gh release create "$GITHUB_REF_NAME" ./*.zip --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
